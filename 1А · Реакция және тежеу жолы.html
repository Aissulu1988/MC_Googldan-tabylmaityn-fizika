function makeCar(col){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(1.9,.62,4.4),mt(col,.25,.5)),cab=new THREE.Mesh(new THREE.BoxGeometry(1.6,.55,2.2),new THREE.MeshStandardMaterial({color:0x182436,roughness:.1,metalness:.6}));body.position.y=.72;cab.position.set(0,1.25,-.15);body.castShadow=cab.castShadow=true;g.add(body,cab);
const wmx=mt(0x111111,.7);[[-.98,1.4],[.98,1.4],[-.98,-1.4],[.98,-1.4]].forEach(([x,z])=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.3,16),wmx);w.rotation.z=Math.PI/2;w.position.set(x,.38,z);w.castShadow=true;g.add(w)});
const tl=new THREE.MeshStandardMaterial({color:0x550000,emissive:0xff1111,emissiveIntensity:0}),hl=new THREE.MeshBasicMaterial({color:0xfff6d0});[-.7,.7].forEach(x=>{const t=new THREE.Mesh(new THREE.BoxGeometry(.4,.18,.06),tl);t.position.set(x,.86,-2.2);const h=new THREE.Mesh(new THREE.BoxGeometry(.4,.16,.06),hl);h.position.set(x,.8,2.2);g.add(t,h)});g.userData.tl=tl;return g}
const cars=[makeCar(0x1e88e5),makeCar(0xf4511e)];cars.forEach((c,i)=>{c.position.x=PX[i];scene.add(c)});
const tags=[label('Мен',{s:1.1,bg:'rgba(30,136,229,.9)'}),label('📱 Телефон',{s:1.1,bg:'rgba(244,81,30,.9)'})];tags.forEach((t,i)=>{t.position.set(PX[i],3.6,0);scene.add(t)});
// predicted marks
const marks=[];function mark(x,col){const m=new THREE.Mesh(new THREE.BoxGeometry(3.4,.04,.35),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.85}));m.position.x=x;scene.add(m);const l=label('',{s:.8});scene.add(l);return {m,l,col}}
const mk=[[mark(-2,0x66c2ff),mark(-2,0x1e88e5)],[mark(2,0xffb08a),mark(2,0xf4511e)]];
function setMark(o,z,txt){o.m.position.set(o.m.position.x,.06,z);scene.remove(o.l);o.l=label(txt,{s:.9,bg:'rgba(10,16,30,.85)'});o.l.position.set(o.m.position.x,2.2,z);scene.add(o.l)}
// weather
const NR=900,rp=new Float32Array(NR*6),rx=[],ry=[],rz=[];for(let i=0;i<NR;i++){rx.push(rnd(-20,20));ry.push(rnd(0,18));rz.push(rnd(-8,40))}
const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.BufferAttribute(rp,3));const rain=new THREE.LineSegments(rg,new THREE.LineBasicMaterial({color:0xbcd8ff,transparent:true,opacity:.55}));rain.frustumCulled=false;scene.add(rain);
function weather(){const w=S.w;dome.paint(w=='dry'?['#1c6bcf','#7dbdf3','#eaf5ff']:w=='rain'?['#3a4656','#6c7a8c','#a9b4c0']:['#8e9bb0','#c3ccd8','#eef2f6']);scene.fog=w=='dry'?new THREE.Fog(0xcfe6f8,160,900):new THREE.Fog(w=='rain'?0x8a97a6:0xdfe6ee,50,420);hemi.intensity=w=='dry'?.7:.55;sun.intensity=w=='dry'?1.3:.35;road.material.roughness=w=='dry'?.9:w=='rain'?.18:.35;road.material.metalness=w=='rain'?.25:0;road.material.color.setHex(w=='snow'?0xcfd6df:0xffffff);grass.material.color.setHex(w=='snow'?0xf2f6fa:0x4d8f45);rain.visible=w!='dry';rain.material.color.setHex(w=='rain'?0xbcd8ff:0xffffff);rain.userData.snow=w=='snow'}
// physics
function carS(tr,t){const v=S.v/3.6,tT=L0/v;if(t<tT)return{s:-L0+v*t,v,br:0};const tau=t-tT;if(tau<tr)return{s:v*tau,v,br:0};const d=tau-tr,td=v/S.a;if(d<td)return{s:v*tr+v*d-.5*S.a*d*d,v:v-S.a*d,br:1};return{s:v*tr+v*td-.5*S.a*td*td,v:0,br:1,stop:1}}
const tr=i=>i?S.tB:S.tA,sr=i=>S.v/3.6*tr(i),sb=()=>Math.pow(S.v/3.6,2)/(2*S.a);
const status=i=>{const tot=sr(i)+sb();return tot<=S.D?['✓ Уақытында тоқтады','#7dff9a']:tot<S.D+2.8?['⚠ Сызықтан асып тоқтады','#ffd166']:['✗ Жаяу жүргіншіге соқты!','#ff6b6b']};
function refresh(){mk.forEach((p,i)=>{setMark(p[0],sr(i),'реакция '+fm(sr(i),1)+' м');setMark(p[1],sr(i)+sb(),'тоқтау '+fm(sr(i)+sb(),1)+' м')});lineM.position.z=S.D-.6;zebra.position.z=S.D+1.8;peds.forEach(p=>p.position.z=S.D+2.8);lights.forEach(l=>l.g.parent.position.z=S.D);
hud.innerHTML=[0,1].map(i=>{const st=status(i);return `<div><b style="color:${i?'#ff9a73':'#7cc0ff'}">${i?'📱 Телефон':'Мен'}</b> <span class="k">t₀ =</span> <b>${fm(tr(i),2)} с</b> · реакция <b>${fm(sr(i),1)} м</b> · тежеу <b>${fm(sb(),1)} м</b> · жалпы <b>${fm(sr(i)+sb(),1)} м</b> <span style="color:${st[1]}">${st[0]}</span></div>`}).join('')+`<div class="k">Стоп-сызыққа дейін: ${S.D} м · v = ${S.v} км/сағ (${fm(S.v/3.6,1)} м/с) · a = ${fm(S.a,1)} м/с²</div>`}
function reset(){S.run=false;S.t=0;S.done=false;S.end=0;S.over=0;banner.style.display='none';peds.forEach((p,i)=>{p.rotation.z=0;p.position.y=0});lights.forEach(l=>{l.r.material.color.setHex(0x330000);l.g.material.color.setHex(0x00aa33)});refresh();pose(0)}
function pose(t){cars.forEach((c,i)=>{const o=carS(tr(i),t);c.position.set(PX[i],0,o.s-2.2);c.userData.tl.emissiveIntensity=o.br?2.2:0;tags[i].position.set(PX[i],3.6,o.s-2.2);c.userData.o=o});const tT=L0/(S.v/3.6);const red=t>=tT;lights.forEach(l=>{l.r.material.color.setHex(red?0xff2a1a:0x330000);l.g.material.color.setHex(red?0x062a10:0x00cc44)})}
// UI
const g1=sec('Жүргізуші'),g2=sec('Сызғыш арқылы реакция'),g3=sec('Қозғалыс және жол'),g4=sec('Басқару');
const sA=slider(g1,'«Мен» реакция уақыты t₀',.1,1,.01,.2,v=>fm(v,2)+' с',v=>{S.tA=v;refresh();if(!S.run)pose(S.t)});
slider(g1,'📱 Телефонға қараған жүргізуші',.5,2.5,.05,1.5,v=>fm(v,2)+' с',v=>{S.tB=v;refresh()});
const tc=el('<div class="top" style="flex:1 1 100%"><span>Сызғыш құлаған биіктік → уақыт</span><b></b></div>');
slider(g2,'Сызғыш h',5,40,1,20,v=>v+' см',v=>{S.h=v;tc.lastChild.textContent='t = √(2h/g) = '+fm(Math.sqrt(2*v/100/9.8),2)+' с'});g2.appendChild(tc);tc.lastChild.textContent='t = √(2h/g) = 0,20 с';
btn(g2,'⬆ Мен үшін қолдану','b'.replace('b','g'),()=>{sA.set(Math.round(Math.sqrt(2*S.h/100/9.8)*100)/100)});
slider(g3,'Көлік жылдамдығы v',30,130,5,90,v=>v+' км/сағ',v=>{S.v=v;refresh();reset()});
seg(g3,Object.entries(WE).map(([k,o])=>[k,o.l]),'dry',k=>{S.w=k;S.a=WE[k].a;as.set(S.a);weather();refresh()});
const as=slider(g3,'Тежеу үдеуі a',1,8,.5,5,v=>fm(v,1)+' м/с²',v=>{S.a=v;refresh()});
slider(g3,'Стоп-сызыққа дейінгі қашықтық',30,150,5,70,v=>v+' м',v=>{S.D=v;refresh()});
btn(g4,'▶ Сигнал!','g',()=>{reset();S.run=true});btn(g4,'↺ Қайта','r',reset);
seg(g4,[['back','🎥 Артынан'],['top','🛰 Жоғарыдан']],'back',k=>S.cam=k);seg(g4,[[1,'×1'],[.4,'×0,4']],1,k=>S.spd=k);
g4.appendChild(el('<div id="note">Қызыл жарық екі көлік стоп-сызықтан 70 м (немесе таңдалған қашықтықта) болғанда жанады. Көк сызық: реакция жолы, қою сызық: толық тоқтау жолы.</div>'));
const cp=new THREE.Vector3(0,6,-60);
function update(dt,time){if(S.run){S.t+=dt*S.spd;pose(S.t);const o=cars.map(c=>c.userData.o);if(!S.done&&o[0].stop&&o[1].stop){S.done=true;S.end=S.t;banner.innerHTML=[0,1].map(i=>{const st=status(i);return `<div style="color:${st[1]}">${i?'📱 Телефон':'Мен'}: ${fm(sr(i)+sb(),1)} м · ${st[0]}</div>`}).join('');banner.style.display='block';[0,1].forEach(i=>{if(sr(i)+sb()>=S.D+2.8){peds[i].rotation.z=1.4;peds[i].position.y=.5}})}}
const mid=S.run||S.t>0?(cars[0].position.z+cars[1].position.z)/2:-L0;let tg;
if(S.cam=='back'){tg=new THREE.Vector3(0,5.5,mid-16);camera.up.set(0,1,0);cp.lerp(tg,.1);camera.position.copy(cp);camera.lookAt(0,1.4,mid+24)}else{tg=new THREE.Vector3(0,125,40);camera.up.set(0,0,1);cp.lerp(tg,.08);camera.position.copy(cp);camera.lookAt(0,0,40)}
dome.position.copy(camera.position);sun.target.position.set(0,0,mid);sun.position.set(-60,90,mid-40);
if(rain.visible){const sn=rain.userData.snow,vy=sn?4:26;for(let i=0;i<NR;i++){ry[i]-=vy*dt;if(ry[i]<0)ry[i]+=18;const x=rx[i]+camera.position.x*0,z=rz[i]+(camera.position.z>-50?camera.position.z:-50),l=sn?.12:.7;rp.set([rx[i],ry[i],z,rx[i]+(sn?.05:0),ry[i]-l,z],i*6)}rg.attributes.position.needsUpdate=true}}
weather();reset();start();

</script>
